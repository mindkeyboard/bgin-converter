[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octane-bgin-json"
version = "0.4.0"
description = "Editable two-way Binary GIN and JSON converter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
render = ["Pillow>=10.1", "texture2ddecoder>=1.0.6"]
mcp = ["mcp>=1.26,<2", "playwright>=1.50,<2", "Pillow>=10.1", "texture2ddecoder>=1.0.6"]

[project.scripts]
bgin-json = "bgin_json.cli:main"
bgin-mcp = "bgin_json.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bgin_json" = ["parameter_help.json"]
"bgin_json.mcp_server" =["skills/bgin-edit/SKILL.md", "skills/bgin-edit/references/*.md"]
