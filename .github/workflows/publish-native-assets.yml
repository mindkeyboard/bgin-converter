name: Publish verified native packages

on:
  workflow_run:
    workflows: [Native VSIX packages]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-native-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bgin-editor-*
          path: native-packages
      - name: Add matching packages to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/publish_native_assets.py --build-commit "$BUILD_COMMIT" --directory native-packages
