name: Publish verified native packages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed native package run ID
        required: true
        type: string
  workflow_run:
    workflows: [Native VSIX packages]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-native-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > build-run.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads(Path('build-run.json').read_text())
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main'
          assert run['status'] == 'completed' and run['name'] == 'Native VSIX packages'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('BUILD_COMMIT=' + run['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          pattern: bgin-editor-*
          path: native-packages
      - name: Add matching packages to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_native_assets.py --build-commit "$BUILD_COMMIT" --directory native-packages
