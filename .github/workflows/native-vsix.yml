name: Native VSIX packages

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (ARMv7 uses slow QEMU emulation)'
        type: choice
        default: standard
        options:
          - standard
          - armv7-only
          - all

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          targets = json.loads(Path('.github/native-targets.json').read_text())
          selection = os.environ['PLATFORMS'] or 'standard'
          if selection != 'all':
              targets = [item for item in targets if (item['target'] == 'linux-armhf') == (selection == 'armv7-only')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(targets, separators=(',', ':')) + '\n')
          PY
  package:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: ${{ !matrix.platform }}
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        if: ${{ !matrix.platform }}
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Build and test Windows or macOS package
        if: ${{ !matrix.platform }}
        shell: bash
        run: |
          python tools/build_nuitka.py --target '${{ matrix.target }}' --timeout 2400
          (cd vscode && npm ci && npm run check && npm run package)
          python tools/smoke_vsix.py dist/*-${{ matrix.target }}.vsix
          python tools/prepare_release.py --target '${{ matrix.target }}'
      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'linux-armhf'
        with:
          platforms: arm
      - name: Build and test Linux package
        if: matrix.platform
        run: |
          docker build --platform '${{ matrix.platform }}' --build-arg NODE_IMAGE='${{ matrix.image }}' -t bgin-native - < tools/linux-build.Dockerfile
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --platform '${{ matrix.platform }}' \
            -v "$PWD:/workspace/bgin-converter" \
            bgin-native sh -ec '
              python3 tools/build_nuitka.py --target ${{ matrix.target }} --timeout 4200
              (cd vscode && npm ci && npm run check && npm run package)
              python3 tools/smoke_vsix.py dist/*-${{ matrix.target }}.vsix
              python3 tools/prepare_release.py --target ${{ matrix.target }}
            '
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bgin-editor-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.vsix
            dist/*-${{ matrix.target }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bgin-build-log-${{ matrix.target }}
          path: build/nuitka/compilation.log
